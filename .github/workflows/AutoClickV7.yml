              private fun showEditStepDialog(flow: Flow, step: Step) {
                  if (step.type == "WRITE_PROMPT") {
                      showPromptDialog(flow)
                      return
                  }
                  val lay = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setPadding(dp(16), dp(8), dp(16), dp(8)) }
                  val etLabel = edit("Etiqueta", step.label)
                  val etX = edit("X", step.x?.toString() ?: "", numeric = true)
                  val etY = edit("Y", step.y?.toString() ?: "", numeric = true)
                  val etX2 = edit("X final", step.x2?.toString() ?: "", numeric = true)
                  val etY2 = edit("Y final", step.y2?.toString() ?: "", numeric = true)
                  val etMs = edit("Milisegundos", step.durationMs?.toString() ?: "", numeric = true)
                  val etSec = edit("Segundos", step.seconds?.toString() ?: "", numeric = true)
                  lay.addView(label("Etiqueta")); lay.addView(etLabel)
                  if (step.type == "TAP" || step.type == "DOWNLOAD_RENAME" || step.type == "LONG_TAP" || step.type == "SWIPE") {
                      lay.addView(label(if (step.type == "SWIPE") "X inicial" else "X")); lay.addView(etX)
                      lay.addView(label(if (step.type == "SWIPE") "Y inicial" else "Y")); lay.addView(etY)
                  }
                  if (step.type == "SWIPE") {
                      lay.addView(label("X final")); lay.addView(etX2)
                      lay.addView(label("Y final")); lay.addView(etY2)
                  }
                  if (step.type == "LONG_TAP" || step.type == "SWIPE" || step.type == "LONG_TAP_DYNAMIC_IMAGE") {
                      lay.addView(label("Milisegundos")); lay.addView(etMs)
                  }
                  if (step.type == "PAUSE") {
                      lay.addView(label("Segundos")); lay.addView(etSec)
                  }
                  val sv = ScrollView(this).apply { addView(lay) }
                  MaterialAlertDialogBuilder(this).setTitle("Editar paso").setView(sv).setPositiveButton("Guardar") { _, _ ->
                      val idx = flow.steps.indexOf(step)
                      if (idx >= 0) {
                          val newSec = etSec.text.toString().toIntOrNull() ?: step.seconds
                          var newLabel = etLabel.text.toString().ifBlank { step.label }
                          if (step.type == "PAUSE" && newSec != null && newLabel == step.label && newSec != step.seconds) {
                              newLabel = "Esperar ${newSec}s"
                          }
                          val newStep = step.copy(
                              label = newLabel,
                              x = etX.text.toString().toFloatOrNull() ?: step.x,
                              y = etY.text.toString().toFloatOrNull() ?: step.y,
                              seconds = newSec,
                              x2 = etX2.text.toString().toFloatOrNull() ?: step.x2,
                              y2 = etY2.text.toString().toFloatOrNull() ?: step.y2,
                              durationMs = etMs.text.toString().toIntOrNull()?.takeIf { it > 0 } ?: step.durationMs
                          )
                          flow.steps[idx] = newStep
                          saveFlows()
                          buildUi()
                      }
                  }.setNegativeButton("Cancelar", null).show()
              }

              private fun hasStorage(): Boolean =
                  if (Build.VERSION.SDK_INT >= 30) Environment.isExternalStorageManager()
                  else checkSelfPermission(Manifest.permission.WRITE_EXTERNAL_STORAGE) == PackageManager.PERMISSION_GRANTED

              private fun askStorage() {
                  if (Build.VERSION.SDK_INT >= 30) {
                      try {
                          startActivity(Intent(Settings.ACTION_MANAGE_APP_ALL_FILES_ACCESS_PERMISSION, Uri.parse("package:$packageName")))
                      } catch (e: Exception) {
                          startActivity(Intent(Settings.ACTION_MANAGE_ALL_FILES_ACCESS_PERMISSION))
                      }
                  } else {
                      requestPermissions(arrayOf(Manifest.permission.WRITE_EXTERNAL_STORAGE, Manifest.permission.READ_EXTERNAL_STORAGE), 1)
                  }
              }

              private fun askAccessibility() {
                  startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
              }

              private fun showLog() {
                  val tv = TextView(this).apply {
                      text = Logger.read().ifEmpty { "(vacio)" }
                      setTextColor(Color.WHITE)
                      textSize = 12f
                      setPadding(dp(12), dp(12), dp(12), dp(12))
                      setTextIsSelectable(true)
                  }
                  val sv = ScrollView(this).apply {
                      setBackgroundColor(Color.parseColor("#121212"))
                      addView(tv)
                  }
                  MaterialAlertDialogBuilder(this)
                      .setTitle("Registro")
                      .setView(sv)
                      .setPositiveButton("Cerrar", null)
                      .setNeutralButton("Copiar") { _, _ ->
                          val cm = getSystemService(CLIPBOARD_SERVICE) as ClipboardManager
                          cm.setPrimaryClip(ClipData.newPlainText("registro", Logger.read()))
                          toast("Copiado")
                      }
                      .setNegativeButton("Borrar") { _, _ -> Logger.clear() }
                      .show()
              }

              private fun executeFlow(flow: Flow) {
                  saveFlows()
                  val svc = ClickService.instance
                  if (svc == null) {
                      toast("Primero activa accesibilidad")
                      askAccessibility()
                      return
                  }
                  if (!hasStorage()) {
                      toast("Falta permiso de archivos")
                      askStorage()
                      return
                  }
                  if (flow.steps.isEmpty()) {
                      toast("El flujo no tiene pasos")
                      return
                  }
                  if (parsePromptList(flow.promptList()).isEmpty()) {
                      toast("Agrega el paso Prompt con tu lista (1. texto)")
                      return
                  }
                  if (!File(flow.folder).isDirectory) {
                      toast("Carpeta no existe: ${flow.folder}")
                      return
                  }
                  if (!svc.startFlow(flow)) return
                  if (flow.useFloatingButton) {
                      toast("Flujo ${flow.name}: aparecieron ▶ PLAY y ■ DETENER. Abre la IA y pulsa PLAY")
                  } else {
                      toast("Flujo ${flow.name} empieza en ${flow.waitBeforeStart}s. Abre la IA. Para parar: ■ DETENER")
                  }
                  moveTaskToBack(true)
              }

              private fun toast(m: String) = Toast.makeText(this, m, Toast.LENGTH_LONG).show()
          }
