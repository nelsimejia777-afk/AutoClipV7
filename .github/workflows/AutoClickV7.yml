              private fun showCreateFlowDialog() {
                  val et = edit("Nombre del flujo", "Gemini")
                  MaterialAlertDialogBuilder(this)
                      .setTitle("Nuevo flujo")
                      .setView(et.apply { setPadding(dp(16), dp(8), dp(16), dp(8)) })
                      .setPositiveButton("Crear") { _, _ ->
                          val name = et.text.toString().ifBlank { "Flujo ${flows.size + 1}" }
                          val flow = Flow(name = name)
                          flows.add(flow)
                          saveFlows()
                          currentFlowId = flow.id
                          buildUi()
                      }
                      .setNegativeButton("Cancelar", null)
                      .show()
              }

              private fun showFlowMenu(flow: Flow) {
                  val options = arrayOf("Renombrar", "Duplicar", "Borrar")
                  MaterialAlertDialogBuilder(this)
                      .setTitle(flow.name)
                      .setItems(options) { _, which ->
                          when (which) {
                              0 -> {
                                  val et = edit("Nombre", flow.name)
                                  MaterialAlertDialogBuilder(this).setTitle("Renombrar").setView(et).setPositiveButton("Guardar") { _, _ ->
                                      flow.name = et.text.toString().ifBlank { flow.name }
                                      saveFlows()
                                      buildUi()
                                  }.setNegativeButton("Cancelar", null).show()
                              }
                              1 -> {
                                  val copy = flow.copy(id = java.util.UUID.randomUUID().toString(), name = flow.name + " copia", steps = flow.steps.map { it.copy(id = java.util.UUID.randomUUID().toString()) }.toMutableList())
                                  flows.add(copy)
                                  saveFlows()
                                  buildUi()
                              }
                              2 -> {
                                  MaterialAlertDialogBuilder(this).setTitle("Borrar ${flow.name}?").setPositiveButton("Borrar") { _, _ ->
                                      flows.remove(flow)
                                      saveFlows()
                                      buildUi()
                                  }.setNegativeButton("Cancelar", null).show()
                              }
                          }
                      }.show()
              }

              private fun showStepMenu(flow: Flow, step: Step) {
                  val options = arrayOf("Editar", "Borrar", "Mover arriba", "Mover abajo")
                  MaterialAlertDialogBuilder(this)
                      .setTitle(step.label)
                      .setItems(options) { _, which ->
                          when (which) {
                              0 -> showEditStepDialog(flow, step)
                              1 -> {
                                  flow.steps.remove(step)
                                  saveFlows()
                                  buildUi()
                              }
                              2 -> {
                                  val idx = flow.steps.indexOf(step)
                                  if (idx > 0) {
                                      flow.steps.removeAt(idx)
                                      flow.steps.add(idx - 1, step)
                                      saveFlows()
                                      buildUi()
                                  }
                              }
                              3 -> {
                                  val idx = flow.steps.indexOf(step)
                                  if (idx >= 0 && idx < flow.steps.size - 1) {
                                      flow.steps.removeAt(idx)
                                      flow.steps.add(idx + 1, step)
                                      saveFlows()
                                      buildUi()
                                  }
                              }
                          }
                      }.show()
              }

              private fun showPromptDialog(flow: Flow) {
                  val existing = flow.steps.firstOrNull { it.type == "WRITE_PROMPT" }
                  val current = existing?.text?.takeIf { it.isNotBlank() } ?: flow.promptsRaw
                  val et = edit("1. generame imagen de un gato", current, multi = true)
                  et.minLines = 8
                  val lay = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(16), dp(8), dp(16), dp(8))
                  }
                  lay.addView(label("Formato: numero, punto y el prompt (1. texto). El numero sera el nombre de la imagen descargada.", 12f))
                  lay.addView(et)
                  val sv = ScrollView(this).apply { addView(lay) }
                  val dialog = MaterialAlertDialogBuilder(this)
                      .setTitle("Lista de prompts")
                      .setView(sv)
                      .setPositiveButton("Guardar", null)
                      .setNegativeButton("Cancelar", null)
                      .show()
                  dialog.getButton(DialogInterface.BUTTON_POSITIVE).setOnClickListener {
                      val txt = et.text.toString()
                      val n = parsePromptList(txt).size
                      if (n == 0) {
                          toast("Formato invalido. Usa: 1. texto")
                          return@setOnClickListener
                      }
                      if (existing != null) {
                          val idx = flow.steps.indexOf(existing)
                          if (idx >= 0) flow.steps[idx] = existing.copy(text = txt)
                      } else {
                          flow.steps.add(Step(type = "WRITE_PROMPT", label = "Escribir Prompt", text = txt))
                      }
                      flow.promptsRaw = ""
                      saveFlows()
                      toast("Prompts guardados: $n")
                      dialog.dismiss()
                      buildUi()
                  }
              }

