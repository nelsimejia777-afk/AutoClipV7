          cat > 'app/src/main/java/com/autoprompter/Models.kt' <<'FIN_ARCHIVO_5'
          package com.autoprompter

          import java.util.UUID

          data class Prompt(val num: Int, val text: String)

          // Todos los campos tienen valor por defecto: asi Kotlin genera un constructor sin argumentos
          // y Gson aplica esos valores a los campos que falten en datos guardados con versiones anteriores.
          data class Step(
              val id: String = UUID.randomUUID().toString(),
              val type: String = "", // TAP, LONG_TAP, SWIPE, WRITE_PROMPT, PAUSE, DOWNLOAD_RENAME, TAP_DYNAMIC_IMAGE, LONG_TAP_DYNAMIC_IMAGE
              val label: String = "",
              val x: Float? = null,
              val y: Float? = null,
              val seconds: Int? = null,
              val text: String? = null,
              val x2: Float? = null,
              val y2: Float? = null,
              val durationMs: Int? = null
          )

          data class Flow(
              val id: String = UUID.randomUUID().toString(),
              var name: String = "",
              var folder: String = "/storage/emulated/0/Download",
              var promptsRaw: String = "",
              var steps: MutableList<Step> = mutableListOf(),
              var waitBeforeStart: Int = 15,
              var useFloatingButton: Boolean = true,
              var typingDelayMs: Int = 50
          ) {
              fun promptList(): String {
                  val s = steps.firstOrNull { it.type == "WRITE_PROMPT" && !it.text.isNullOrBlank() }
                  return s?.text ?: promptsRaw
              }
          }

          fun parsePromptList(text: String): List<Prompt> {
              val re = Regex("^\\s*(\\d+)\\s*\\.\\s*(.*)$")
              val out = mutableListOf<Prompt>()
              var num = -1
              val sb = StringBuilder()
              fun flush() {
                  if (num >= 0 && sb.isNotBlank()) out.add(Prompt(num, sb.toString().trim()))
                  sb.setLength(0)
              }
              for (line in text.lines()) {
                  val m = re.find(line)
                  if (m != null) {
                      flush()
                      num = m.groupValues[1].toIntOrNull() ?: -1
                      sb.append(m.groupValues[2])
                  } else if (line.isNotBlank() && num >= 0) {
                      sb.append(' ').append(line.trim())
                  }
              }
              flush()
              return out
          }
