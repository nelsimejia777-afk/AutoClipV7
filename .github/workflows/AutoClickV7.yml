name: Build APK v2
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Limpiar proyecto viejo
        run: |
          rm -rf app build.gradle.kts settings.gradle.kts gradle.properties

      - name: Crear archivos del proyecto
        run: |
          mkdir -p "$(dirname 'app/build.gradle.kts')"
          cat > 'app/build.gradle.kts' <<'FIN_ARCHIVO_0'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.autoprompter"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.autoprompter"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 5
                  versionName = "2.3"
              }

              buildTypes {
                  release { isMinifyEnabled = false }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }

          dependencies {
              implementation("com.google.android.material:material:1.12.0")
              implementation("androidx.appcompat:appcompat:1.6.1")
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("com.google.code.gson:gson:2.10.1")
          }
          FIN_ARCHIVO_0
          mkdir -p "$(dirname 'app/src/main/AndroidManifest.xml')"
          cat > 'app/src/main/AndroidManifest.xml' <<'FIN_ARCHIVO_1'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />

              <application
                  android:allowBackup="false"
                  android:label="@string/app_name"
                  android:requestLegacyExternalStorage="true"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".ClickService"
                      android:exported="true"
                      android:label="@string/app_name"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_config" />
                  </service>
              </application>
          </manifest>
          FIN_ARCHIVO_1
          mkdir -p "$(dirname 'app/src/main/java/com/autoprompter/ClickService.kt')"
          cat > 'app/src/main/java/com/autoprompter/ClickService.kt' <<'FIN_ARCHIVO_2'
          package com.autoprompter

          import android.accessibilityservice.AccessibilityService
          import android.accessibilityservice.GestureDescription
          import android.content.Intent
          import android.graphics.Color
          import android.graphics.Path
          import android.graphics.PixelFormat
          import android.graphics.Rect
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.util.Log
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.View
          import android.view.ViewConfiguration
          import android.view.WindowManager
          import android.view.accessibility.AccessibilityEvent
          import android.view.accessibility.AccessibilityNodeInfo
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.Toast
          import java.io.File
          import java.util.concurrent.CountDownLatch
          import java.util.concurrent.TimeUnit
          import java.util.concurrent.atomic.AtomicBoolean

          class ClickService : AccessibilityService() {

              companion object {
                  @Volatile
                  var instance: ClickService? = null
              }

              private val main = Handler(Looper.getMainLooper())

              // running = el trabajo esta en marcha; armed = esperando que se pulse PLAY
              @Volatile private var running = false
              @Volatile private var armed = false
              @Volatile private var worker: Thread? = null
              private var overlay: View? = null

              // Ultima posicion del panel (offset desde arriba y desde la derecha), para que no salte al pulsar PLAY
              private var panelX = 0
              private var panelY = 120

              override fun onServiceConnected() {
                  super.onServiceConnected()
                  Logger.init(this)
                  instance = this
                  Logger.log("Servicio de accesibilidad conectado")
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {}
              override fun onInterrupt() {}

              override fun onUnbind(intent: Intent?): Boolean {
                  stopRun("Servicio desconectado")
                  instance = null
                  return super.onUnbind(intent)
              }

              // ---------- API publica ----------

              /** Devuelve true si el flujo fue aceptado (arrancado o esperando PLAY). */
              fun startFlow(flow: Flow): Boolean {
                  if (running) {
                      toast("Ya hay un flujo corriendo. Pulsa DETENER para pararlo.")
                      return false
                  }
                  if (flow.useFloatingButton) {
                      armed = true
                      showPanel(flow, true)
                  } else {
                      beginRun(flow)
                  }
                  return true
              }

              fun stopRun(reason: String) {
                  val wasActive = running || armed
                  running = false
                  armed = false
                  if (wasActive) Logger.log(reason)
                  val w = worker
                  worker = null
                  w?.interrupt()
                  hideOverlay()
              }

              // ---------- control del trabajo ----------

              private fun beginRun(flow: Flow) {
                  if (running) return
                  armed = false
                  running = true
                  showPanel(flow, false)
                  val t = Thread { runJob(flow) }
                  worker = t
                  t.start()
              }

              /** Solo el hilo vigente puede dar por terminado el trabajo. */
              private fun finishRun(me: Thread, reason: String) {
                  if (worker === me) stopRun(reason)
              }

              private fun alive(): Boolean = running && Thread.currentThread() === worker

              private fun runJob(flow: Flow) {
                  val me = Thread.currentThread()
                  try {
                      val prompts = parsePromptList(flow.promptList())
                      if (prompts.isEmpty()) {
                          Logger.log("Lista de prompts vacia o mal formada")
                          finishRun(me, "Lista vacia")
                          toast("La lista de prompts esta vacia o mal formada")
                          return
                      }
                      Logger.log("INICIO flujo ${flow.name}: ${prompts.size} prompts, espera inicial ${flow.waitBeforeStart}s")
                      if (!pause(flow.waitBeforeStart * 1000L)) return

                      for (p in prompts) {
                          if (!alive()) return
                          Logger.log("--- Prompt ${p.num}: ${p.text.take(60)} ---")
                          if (!processOne(flow, p)) {
                              if (alive()) {
                                  finishRun(me, "DETENIDO en prompt ${p.num} (fallo un paso)")
                                  toast("Detenido en prompt ${p.num}. Mira el registro.")
                              }
                              return
                          }
                      }
                      if (alive()) {
                          finishRun(me, "TERMINADO flujo ${flow.name}")
                          toast("Flujo terminado")
                      }
                  } catch (e: Throwable) {
                      if (alive()) {
                          Logger.log("ERROR: ${Log.getStackTraceString(e)}")
                          finishRun(me, "Error")
                      }
                  }
              }

              private fun processOne(flow: Flow, prompt: Prompt): Boolean {
                  for (step in flow.steps) {
                      if (!alive()) return false
                      Logger.log("Paso: ${step.label}")
                      when (step.type) {
                          "TAP" -> {
                              if (step.x == null || step.y == null) {
                                  Logger.log("Paso sin coordenadas: ${step.label}")
                                  return false
                              }
                              if (!tap(step.x, step.y)) {
                                  Logger.log("Fallo el toque ${step.label} en ${step.x},${step.y}")
                                  return false
                              }
                              if (!pause(800)) return false
                          }
                          "LONG_TAP" -> {
                              if (step.x == null || step.y == null) {
                                  Logger.log("Paso sin coordenadas: ${step.label}")
                                  return false
                              }
                              val dur = (step.durationMs ?: 1000).toLong()
                              Logger.log("Pulsacion larga en ${step.x},${step.y} durante $dur ms")
                              if (!gesture(step.x, step.y, step.x, step.y, dur, false)) {
                                  Logger.log("Fallo la pulsacion larga ${step.label} en ${step.x},${step.y}")
                                  return false
                              }
                              if (!pause(800)) return false
                          }
                          "SWIPE" -> {
                              if (step.x == null || step.y == null || step.x2 == null || step.y2 == null) {
                                  Logger.log("Paso sin coordenadas: ${step.label}")
                                  return false
                              }
                              val dur = (step.durationMs ?: 400).toLong()
                              Logger.log("Deslizar de ${step.x},${step.y} a ${step.x2},${step.y2} en $dur ms")
                              if (!gesture(step.x, step.y, step.x2, step.y2, dur, true)) {
                                  Logger.log("Fallo el deslizamiento ${step.label}")
                                  return false
                              }
                              if (!pause(800)) return false
                          }
                          "WRITE_PROMPT" -> {
                              var ok = false
                              for (i in 1..3) {
                                  if (insertText(prompt.text, flow.typingDelayMs)) { ok = true; break }
                                  if (!alive()) return false
                                  if (!pause(600)) return false
                              }
                              if (!ok) {
                                  Logger.log("No se pudo escribir el prompt")
                                  return false
                              }
                              if (!pause(600)) return false
                          }
                          "PAUSE" -> {
                              val sec = step.seconds ?: 5
                              Logger.log("Pausa ${sec}s")
                              if (!pause(sec * 1000L)) return false
                          }
                          "DOWNLOAD_RENAME" -> {
                              val folder = flow.folder
                              val before = snapshot(folder)
                              if (step.x != null && step.y != null) {
                                  if (!tap(step.x, step.y)) {
                                      Logger.log("Fallo el toque de descargar ${step.x},${step.y}")
                                      return false
                                  }
                              }
                              Logger.log("Esperando archivo nuevo en $folder")
                              val nuevo = waitNewFile(folder, before)
                              if (nuevo == null) {
                                  if (!alive()) return false
                                  Logger.log("AVISO: no aparecio archivo nuevo")
                              } else {
                                  renameFile(nuevo, prompt.num)
                              }
                              if (!pause(1200)) return false
                          }
                          "TAP_DYNAMIC_IMAGE" -> {
                              val rect = findNewestImageViewNode()
                              if (rect == null) {
                                  Logger.log("No se encontro ninguna imagen en pantalla de forma dinamica")
                                  return false
                              }
                              Logger.log("Imagen dinamica encontrada en centro: X=${rect.centerX()}, Y=${rect.centerY()}")
                              if (!tap(rect.centerX().toFloat(), rect.centerY().toFloat())) {
                                  Logger.log("Fallo el toque dinamico en la imagen")
                                  return false
                              }
                              if (!pause(800)) return false
                          }
                          "LONG_TAP_DYNAMIC_IMAGE" -> {
                              val rect = findNewestImageViewNode()
                              if (rect == null) {
                                  Logger.log("No se encontro imagen para pulsacion larga dinamica")
                                  return false
                              }
                              val dur = (step.durationMs ?: 1000).toLong()
                              Logger.log("Pulsacion larga dinamica en: X=${rect.centerX()}, Y=${rect.centerY()}")
                              if (!gesture(rect.centerX().toFloat(), rect.centerY().toFloat(), rect.centerX().toFloat(), rect.centerY().toFloat(), dur, false)) {
                                  Logger.log("Fallo la pulsacion larga dinamica")
                                  return false
                              }
                              if (!pause(800)) return false
                          }
                      }
                  }
                  return true
              }

              // ---------- acciones basicas ----------

              private fun tap(x: Float, y: Float): Boolean {
                  val path = Path().apply { moveTo(x, y) }
                  val gesture = GestureDescription.Builder()
                      .addStroke(GestureDescription.StrokeDescription(path, 0, 60))
                      .build()
                  val latch = CountDownLatch(1)
                  val ok = AtomicBoolean(false)
                  val accepted = dispatchGesture(gesture, object : GestureResultCallback() {
                      override fun onCompleted(g: GestureDescription?) { ok.set(true); latch.countDown() }
                      override fun onCancelled(g: GestureDescription?) { latch.countDown() }
                  }, main)
                  if (!accepted) return false
                  try {
                      latch.await(3, TimeUnit.SECONDS)
                  } catch (e: InterruptedException) {
                      return false
                  }
                  return ok.get()
              }

              /** Pulsacion larga (swipe = false: el dedo se queda quieto) o deslizamiento (swipe = true). */
              private fun gesture(x1: Float, y1: Float, x2: Float, y2: Float, durationMs: Long, swipe: Boolean): Boolean {
                  val dur = durationMs.coerceIn(1L, 60000L)
                  val path = Path().apply {
                      moveTo(x1, y1)
                      if (swipe) lineTo(x2, y2)
                  }
                  val desc = GestureDescription.Builder()
                      .addStroke(GestureDescription.StrokeDescription(path, 0, dur))
                      .build()
                  val latch = CountDownLatch(1)
                  val ok = AtomicBoolean(false)
                  val accepted = dispatchGesture(desc, object : GestureResultCallback() {
                      override fun onCompleted(g: GestureDescription?) { ok.set(true); latch.countDown() }
                      override fun onCancelled(g: GestureDescription?) { latch.countDown() }
                  }, main)
                  if (!accepted) return false
                  try {
                      latch.await(dur + 3000L, TimeUnit.MILLISECONDS)
                  } catch (e: InterruptedException) {
                      return false
                  }
                  return ok.get()
              }

              // ---------- escritura de texto ----------

              /** Busca el campo de texto: primero el que tiene foco, si no el primer editable. */
              private fun findInputNode(): AccessibilityNodeInfo? {
                  val root = rootInActiveWindow ?: return null
                  return root.findFocus(AccessibilityNodeInfo.FOCUS_INPUT) ?: findEditable(root)
              }

              private fun setNodeText(node: AccessibilityNodeInfo, text: String): Boolean {
                  val args = Bundle().apply {
                      putCharSequence(AccessibilityNodeInfo.ACTION_ARGUMENT_SET_TEXT_CHARSEQUENCE, text)
                  }
                  return node.performAction(AccessibilityNodeInfo.ACTION_SET_TEXT, args)
              }

              /** Pausa corta de tipeo que respeta la interrupcion del hilo. */
              private fun typingSleep(ms: Long): Boolean {
                  return try {
                      Thread.sleep(ms)
                      true
                  } catch (e: InterruptedException) {
                      false
                  }
              }

              /**
               * Escribe el texto en el campo activo.
               * delayMs > 0: simula escritura humana letra por letra (ms aproximados por letra).
               * delayMs = 0: escribe todo el texto de golpe.
               * Comprueba el resultado de cada accion y, si el nodo quedo obsoleto, lo busca de nuevo.
               */
              private fun insertText(text: String, delayMs: Int): Boolean {
                  var node: AccessibilityNodeInfo? = findInputNode()
                  if (node == null) {
                      if (rootInActiveWindow == null) {
                          Logger.log("Escribir: no hay ventana activa")
                      } else {
                          Logger.log("Escribir: no encontre ningun campo de texto en pantalla")
                      }
                      return false
                  }

                  if (delayMs <= 0) {
                      Logger.log("Escribiendo prompt de golpe...")
                      var ok = setNodeText(node, text)
                      if (!ok) {
                          val fresh = findInputNode()
                          if (fresh != null) {
                              node = fresh
                              ok = setNodeText(fresh, text)
                          }
                      }
                      if (!ok) {
                          Logger.log("Escribir: el campo rechazo el texto")
                          return false
                      }
                  } else {
                      Logger.log("Escribiendo prompt simulando escritura humana (~$delayMs ms por letra)...")
                      val d = delayMs.toLong()
                      val jitter = d * 4 / 10
                      val sb = StringBuilder()
                      for (ch in text) {
                          if (!alive()) return false
                          sb.append(ch)
                          var ok = setNodeText(node!!, sb.toString())
                          var tries = 0
                          while (!ok && tries < 3) {
                              tries++
                              if (!alive()) return false
                              if (!pause(150)) return false
                              val fresh = findInputNode()
                              if (fresh != null) {
                                  node = fresh
                                  ok = setNodeText(fresh, sb.toString())
                              }
                          }
                          if (!ok) {
                              Logger.log("Escribir: fallo al escribir la letra ${sb.length} de ${text.length}")
                              return false
                          }
                          val wait = if (jitter > 0) (d - jitter..d + jitter).random() else d
                          if (!typingSleep(wait)) return false
                      }
                  }

                  // Comprobacion final (solo aviso en el registro)
                  try {
                      val n = node
                      if (n != null) {
                          n.refresh()
                          val cur = n.text?.toString() ?: ""
                          val probe = text.take(20).trim()
                          if (cur.isEmpty() || (probe.isNotEmpty() && !cur.contains(probe))) {
                              Logger.log("AVISO: el campo no muestra el texto esperado tras escribir")
                          }
                      }
                  } catch (_: Exception) {
                  }
                  return true
              }

              /**
               * Busqueda universal de la imagen generada.
               * 1) Prefiere nodos cuya clase sea una imagen (ImageView / android.widget.Image en Chrome).
               * 2) Si no hay ninguno, usa como respaldo un nodo grande SIN hijos que no sea editable.
               * Descarta cualquier nodo que ocupe casi toda la pantalla (contenedores / raiz) y recorta
               * el area a la parte visible. Entre los candidatos elige el mas bajo en pantalla.
               */
              private fun findNewestImageViewNode(): Rect? {
                  val root = rootInActiveWindow ?: return null
                  val dm = resources.displayMetrics
                  val screen = Rect(0, 0, dm.widthPixels, dm.heightPixels)
                  val screenArea = screen.width().toLong() * screen.height().toLong()
                  val minSide = (100 * dm.density).toInt()

                  var bestImg: Rect? = null
                  var bestImgClass = ""
                  var bestLeaf: Rect? = null
                  var bestLeafClass = ""

                  fun better(cand: Rect, cur: Rect?): Boolean {
                      if (cur == null) return true
                      if (cand.bottom != cur.bottom) return cand.bottom > cur.bottom
                      return cand.width().toLong() * cand.height() > cur.width().toLong() * cur.height()
                  }

                  val queue = java.util.ArrayDeque<AccessibilityNodeInfo>()
                  queue.add(root)
                  var visited = 0

                  while (queue.isNotEmpty() && visited < 4000) {
                      val n = queue.poll() ?: break
                      visited++
                      if (n.isVisibleToUser) {
                          val rect = Rect()
                          n.getBoundsInScreen(rect)
                          if (rect.intersect(screen) && rect.width() >= minSide && rect.height() >= minSide) {
                              val area = rect.width().toLong() * rect.height().toLong()
                              if (area < screenArea * 85 / 100) {
                                  val cls = n.className?.toString() ?: ""
                                  if (cls.contains("Image", ignoreCase = true)) {
                                      if (better(rect, bestImg)) {
                                          bestImg = Rect(rect)
                                          bestImgClass = cls
                                      }
                                  } else if (n.childCount == 0 && !n.isEditable) {
                                      if (better(rect, bestLeaf)) {
                                          bestLeaf = Rect(rect)
                                          bestLeafClass = cls
                                      }
                                  }
                              }
                          }
                      }
                      for (i in 0 until n.childCount) {
                          val c = n.getChild(i)
                          if (c != null) queue.add(c)
                      }
                  }

                  if (bestImg != null) {
                      Logger.log("Imagen detectada por clase: $bestImgClass")
                      return bestImg
                  }
                  if (bestLeaf != null) {
                      Logger.log("AVISO: sin nodo de imagen; uso respaldo (nodo grande sin hijos): $bestLeafClass")
                      return bestLeaf
                  }
                  return null
              }

              private fun findEditable(root: AccessibilityNodeInfo): AccessibilityNodeInfo? {
                  val queue = java.util.ArrayDeque<AccessibilityNodeInfo>()
                  queue.add(root)
                  var firstEditable: AccessibilityNodeInfo? = null
                  while (queue.isNotEmpty()) {
                      val n = queue.poll() ?: break
                      if (n.isEditable) {
                          if (n.isFocused) return n
                          if (firstEditable == null) firstEditable = n
                      }
                      for (i in 0 until n.childCount) {
                          val c = n.getChild(i)
                          if (c != null) queue.add(c)
                      }
                  }
                  if (firstEditable != null) Logger.log("Escribir: ningun campo con foco, uso el primer campo editable")
                  return firstEditable
              }

              private fun snapshot(folder: String): Set<String> =
                  File(folder).listFiles()?.map { it.absolutePath }?.toSet() ?: emptySet()

              private fun isTemp(name: String): Boolean {
                  val n = name.lowercase()
                  return n.startsWith(".") || n.endsWith(".crdownload") || n.endsWith(".tmp") ||
                      n.endsWith(".part") || n.endsWith(".partial") || n.endsWith(".download")
              }

              private fun waitNewFile(folder: String, before: Set<String>): File? {
                  for (i in 1..30) {
                      if (!pause(1000)) return null
                      val cand = File(folder).listFiles()
                          ?.filter { it.isFile && it.absolutePath !in before && !isTemp(it.name) }
                          ?.maxByOrNull { it.lastModified() }
                      if (cand != null) {
                          val size = cand.length()
                          if (!pause(1500)) return null
                          if (cand.exists() && cand.length() == size) return cand
                      }
                  }
                  return null
              }

              private fun renameFile(f: File, num: Int) {
                  val ext = f.extension
                  val base = num.toString()
                  fun name(suffix: String) = if (ext.isEmpty()) "$base$suffix" else "$base$suffix.$ext"
                  var target = File(f.parentFile, name(""))
                  var i = 1
                  while (target.exists()) {
                      target = File(f.parentFile, name("_$i"))
                      i++
                  }
                  if (f.renameTo(target)) {
                      Logger.log("Guardado como ${target.name}")
                  } else {
                      Logger.log("No se pudo renombrar ${f.name} a ${target.name}")
                  }
              }

              private fun pause(ms: Long): Boolean {
                  var left = ms
                  try {
                      while (left > 0 && alive()) {
                          val s = minOf(200L, left)
                          Thread.sleep(s)
                          left -= s
                      }
                  } catch (e: InterruptedException) {
                      return false
                  }
                  return alive()
              }

              private fun toast(msg: String) {
                  main.post { Toast.makeText(applicationContext, msg, Toast.LENGTH_LONG).show() }
              }

              // ---------- panel flotante (PLAY y DETENER) ----------

              private fun showPanel(flow: Flow, waitingPlay: Boolean) {
                  main.post {
                      removeOverlayNow()
                      if (!running && !armed) return@post
                      val panel = DragPanel(this).apply {
                          orientation = LinearLayout.HORIZONTAL
                          setBackgroundColor(0xDD202020.toInt())
                          setPadding(8, 8, 8, 8)
                      }
                      if (waitingPlay) {
                          val play = Button(this).apply {
                              text = "▶ PLAY"
                              textSize = 12f
                              setTextColor(Color.WHITE)
                              setBackgroundColor(0xFF2E7D32.toInt())
                              setOnClickListener { beginRun(flow) }
                          }
                          panel.addView(play)
                      }
                      val stop = Button(this).apply {
                          text = "■ DETENER"
                          textSize = 12f
                          setTextColor(Color.WHITE)
                          setBackgroundColor(0xFFB00020.toInt())
                          setOnClickListener { stopRun("Detenido por el usuario") }
                      }
                      val stopLp = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.WRAP_CONTENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                      )
                      if (waitingPlay) stopLp.leftMargin = 12
                      panel.addView(stop, stopLp)

                      val lp = WindowManager.LayoutParams(
                          WindowManager.LayoutParams.WRAP_CONTENT,
                          WindowManager.LayoutParams.WRAP_CONTENT,
                          WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                          WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON,
                          PixelFormat.TRANSLUCENT
                      ).apply { gravity = Gravity.TOP or Gravity.END; x = panelX; y = panelY }
                      try {
                          val wm = getSystemService(WINDOW_SERVICE) as WindowManager
                          panel.wm = wm
                          panel.lp = lp
                          panel.onMoved = { nx, ny -> panelX = nx; panelY = ny }
                          wm.addView(panel, lp)
                          overlay = panel
                      } catch (e: Exception) {
                          Logger.log("No se pudo mostrar el panel flotante: ${e.message}")
                      }
                  }
              }

              /** Quita el panel de inmediato (solo llamar desde el hilo principal). */
              private fun removeOverlayNow() {
                  val v = overlay
                  if (v != null) {
                      try { (getSystemService(WINDOW_SERVICE) as WindowManager).removeView(v) } catch (_: Exception) {}
                  }
                  overlay = null
              }

              private fun hideOverlay() {
                  main.post { removeOverlayNow() }
              }
          }

          /**
           * Panel flotante arrastrable. Un toque normal llega a los botones (PLAY / DETENER);
           * si el dedo se desliza mas alla del umbral, el panel completo se mueve con el dedo.
           * La ventana usa gravity TOP|END, asi que x se mide desde el borde derecho.
           */
          class DragPanel(context: android.content.Context) : LinearLayout(context) {
              var wm: WindowManager? = null
              var lp: WindowManager.LayoutParams? = null
              var onMoved: ((Int, Int) -> Unit)? = null

              private val slop = ViewConfiguration.get(context).scaledTouchSlop
              private var startRawX = 0f
              private var startRawY = 0f
              private var startX = 0
              private var startY = 0
              private var dragging = false

              private fun begin(ev: MotionEvent) {
                  startRawX = ev.rawX
                  startRawY = ev.rawY
                  startX = lp?.x ?: 0
                  startY = lp?.y ?: 0
                  dragging = false
              }

              private fun movedPastSlop(ev: MotionEvent): Boolean {
                  return Math.abs(ev.rawX - startRawX) > slop || Math.abs(ev.rawY - startRawY) > slop
              }

              private fun moveTo(ev: MotionEvent) {
                  val params = lp ?: return
                  val manager = wm ?: return
                  val dm = resources.displayMetrics
                  val maxX = (dm.widthPixels - width).coerceAtLeast(0)
                  val maxY = (dm.heightPixels - height).coerceAtLeast(0)
                  val nx = (startX - (ev.rawX - startRawX)).toInt().coerceIn(0, maxX)
                  val ny = (startY + (ev.rawY - startRawY)).toInt().coerceIn(0, maxY)
                  params.x = nx
                  params.y = ny
                  try {
                      manager.updateViewLayout(this, params)
                      onMoved?.invoke(nx, ny)
                  } catch (_: Exception) {
                  }
              }

              override fun onInterceptTouchEvent(ev: MotionEvent): Boolean {
                  when (ev.actionMasked) {
                      MotionEvent.ACTION_DOWN -> begin(ev)
                      MotionEvent.ACTION_MOVE -> {
                          if (!dragging && movedPastSlop(ev)) {
                              dragging = true
                              return true
                          }
                      }
                      MotionEvent.ACTION_UP, MotionEvent.ACTION_CANCEL -> dragging = false
                  }
                  return dragging
              }

              override fun onTouchEvent(ev: MotionEvent): Boolean {
                  when (ev.actionMasked) {
                      MotionEvent.ACTION_DOWN -> begin(ev)
                      MotionEvent.ACTION_MOVE -> {
                          if (!dragging && movedPastSlop(ev)) dragging = true
                          if (dragging) moveTo(ev)
                      }
                      MotionEvent.ACTION_UP, MotionEvent.ACTION_CANCEL -> dragging = false
                  }
                  return true
              }
          }
